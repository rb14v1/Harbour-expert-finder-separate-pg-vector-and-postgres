# Internal Expert & Policy Finder - Postgres (plain, NO pgvector) + Qdrant
# (dedicated vector database) + Django backend + React frontend. Two
# genuinely separate database systems, not one Postgres-plus-extension - see
# README "Two databases, not pgvector" for why. Deliberately no Celery/Redis:
# this is a small single-workspace demo app with no background/async work.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expert_finder}
      POSTGRES_USER: ${POSTGRES_USER:-expert_finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expert_finder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expert_finder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      USE_SQLITE: "False"
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
